name: docs

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  composite-in-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Verify single-file handbook is up to date
        run: python build-handbook.py --check
